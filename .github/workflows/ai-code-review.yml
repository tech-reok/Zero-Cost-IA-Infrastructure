name: Local AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_review:
    runs-on: [self-hosted, Linux, X64, tech-reok-builders]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtain Diff
        id: get_diff
        run: |
          git diff origin/main...HEAD > pr_diff.txt
          echo "Diff guardado para análisis."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.2' 

      - name: Ejecutar Análisis de IA con Python
        env:
          OLLAMA_URL: "http://127.0.0.1:11434/api/generate"
          OLLAMA_MODEL: "qwen3:4b-custom" 
        run: python .github/scripts/analyze_diff.py

      - name: Comentar en el PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            // Leemos el JSON generado y estructurado por nuestro script de Python
            const result = JSON.parse(fs.readFileSync('ai_response.json', 'utf8'));
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "🤖 **Análisis Automatizado Local:**\n\n" + result.response
            })